<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importech · Control de inventario</title>
<meta name="description" content="Demo interactivo de inventario, ventas, cuotas y garantías para tiendas de tecnología Apple.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Importech">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="login"></div>
<div class="app">
  <aside class="sidebar" id="sb">
    <div class="sb-head" id="sb-head"></div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-user" id="sb-user"></div>
    <div class="sb-foot"><b>Demo interactivo</b>Tus cambios se guardan en este navegador.</div>
  </aside>
  <div class="main-wrap">
    <header class="topbar">
      <button class="burger" data-a="menu" aria-label="Menú">☰</button>
      <div class="search"><span>🔍</span><input id="gsearch" placeholder="Buscar producto, IMEI o serial…" autocomplete="off"></div>
      <div class="top-right"><span class="net-pill" id="net-pill" hidden>Sin conexión</span><button class="btn sm primary" id="install-btn" data-a="install" hidden>⬇ Instalar app</button><span class="demo-pill">Demo · verificación de IMEI simulada</span><div class="avatar" id="top-av">·</div></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div class="scrim" id="scrim" data-a="closeAll"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div id="tip"></div>
<div id="toast"></div>
<div id="print"></div>
<div id="upd" hidden><span>Hay una versión nueva disponible.</span><button class="btn sm primary" data-a="applyUpdate">Actualizar</button></div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/views-ops.js"></script>
<script src="js/views-sales.js"></script>
<script src="js/receipts.js"></script>
<script src="js/views-admin.js"></script>
<script src="js/scanner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
