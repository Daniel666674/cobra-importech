<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importech · Control Total de Inventario iPhone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#4F46E5;--brand-hover:#4338CA;--brand-light:rgba(79,70,229,.10);--brand-border:rgba(79,70,229,.24);--brand-glow:rgba(79,70,229,.35);
  --sb-w:236px;--sb-bg:#0B0E1C;--sb-border:rgba(255,255,255,.06);--sb-item:#8593A8;--sb-hover:#C9D3E0;--sb-active-bg:rgba(79,70,229,.16);--sb-active:#B4BFFB;
  --ws-bg:#F1F4F9;--surface:#fff;--hover:#F8FAFB;--border:#E4E8EF;--border-lt:#EEF1F6;
  --t1:#0D1527;--t2:#3C4A5C;--t3:#6F7E93;--t4:#A8B4C2;
  --green:#12B76A;--green-bg:rgba(18,183,106,.11);--green-t:#0A8A50;
  --amber:#F79009;--amber-bg:rgba(247,144,9,.12);--amber-t:#B76A00;
  --red:#F04438;--red-bg:rgba(240,68,56,.10);--red-t:#C4291D;
  --blue:#2E90FA;--blue-bg:rgba(46,144,250,.10);--blue-t:#1570CF;
  --purple:#7C3AED;--purple-bg:rgba(124,58,237,.10);--purple-t:#6025C8;
  --gray:#667085;--gray-bg:rgba(102,112,133,.11);
  --sh-sm:0 1px 3px rgba(16,24,40,.09),0 1px 2px rgba(16,24,40,.05);
  --sh-lg:0 16px 32px -6px rgba(16,24,40,.16);
  --r:12px;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ws-bg);color:var(--t1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
ul{list-style:none}
table{border-collapse:collapse;width:100%}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sb-w);min-width:var(--sb-w);background:var(--sb-bg);display:flex;flex-direction:column;position:relative;z-index:30}
.sidebar::after{content:'';position:absolute;top:0;right:0;width:1px;height:100%;background:linear-gradient(180deg,transparent,var(--brand-glow) 40%,var(--brand-glow) 60%,transparent);pointer-events:none}
.sb-head{padding:18px 16px 14px;border-bottom:1px solid var(--sb-border)}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:grid;place-items:center;box-shadow:0 0 18px rgba(79,70,229,.45);font-size:17px}
.logo-name{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.4px;line-height:1}
.logo-tag{font-size:9.5px;font-weight:500;color:rgba(255,255,255,.32);letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.sb-nav{flex:1;overflow-y:auto;padding:8px;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.nav-group{font-size:10px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:rgba(255,255,255,.22);padding:14px 8px 4px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:7px;color:var(--sb-item);font-size:13px;font-weight:500;margin-bottom:1px;text-align:left;transition:120ms}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--sb-hover)}
.nav-item.active{background:var(--sb-active-bg);color:var(--sb-active)}
.nav-item .ic{width:18px;text-align:center;font-size:14px}
.nav-item .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px}
.nav-item .badge.b{background:var(--brand)}
.sb-foot{padding:12px 14px;border-top:1px solid var(--sb-border);font-size:11px;color:rgba(255,255,255,.35);line-height:1.4}
.sb-foot b{color:#fff;display:block;font-size:12px}

/* MAIN */
.main-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px;flex-shrink:0}
.burger{display:none;font-size:20px;padding:4px 8px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--ws-bg);border:1px solid var(--border);border-radius:9px;padding:0 12px;height:36px}
.search input{border:none;background:none;outline:none;width:100%;font-size:13px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.demo-pill{font-size:11px;font-weight:600;color:var(--amber-t);background:var(--amber-bg);padding:4px 10px;border-radius:99px;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
#main{flex:1;overflow-y:auto;padding:24px 28px 48px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.page-h p{color:var(--t3);font-size:13.5px;margin-top:2px}

/* COMPONENTS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm)}
.card-p{padding:18px 20px}
.card h3{font-size:14.5px;font-weight:700;letter-spacing:-.1px}
.card .sub{font-size:12.5px;color:var(--t3);margin-top:1px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 0}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
.mt{margin-top:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:4px;line-height:1.15}
.kpi .d{font-size:12.5px;color:var(--t3);margin-top:3px}
.kpi.warn .v{color:var(--amber-t)}.kpi.bad .v{color:var(--red-t)}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);transition:120ms;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:#D3D9E3}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover)}
.btn.danger{color:var(--red-t);border-color:rgba(240,68,56,.3)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--green-bg);color:var(--green-t)}.chip.warn{background:var(--amber-bg);color:var(--amber-t)}
.chip.bad{background:var(--red-bg);color:var(--red-t)}.chip.info{background:var(--blue-bg);color:var(--blue-t)}
.chip.pur{background:var(--purple-bg);color:var(--purple-t)}.chip.gray{background:var(--gray-bg);color:var(--gray)}

.tbl-wrap{overflow-x:auto}
th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);padding:10px 14px;background:#F8FAFB;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border-lt);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
td .m{font-weight:600}td .s{font-size:12px;color:var(--t3)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--border)}
.filters input,.filters select,.f input,.f select,.f textarea{height:36px;border:1px solid var(--border);border-radius:8px;padding:0 10px;background:var(--surface);outline:none;min-width:0}
.filters input:focus,.f input:focus,.f select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.filters input{flex:1;min-width:200px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px}
.f input,.f select{width:100%}
.f .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.f .chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.f .chk input{width:auto;height:auto}
.empty{padding:40px;text-align:center;color:var(--t3)}
.bar{height:7px;background:var(--border-lt);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.g i{background:var(--green)}.bar.r i{background:var(--red)}

/* DRAWER / MODAL */
.scrim{position:fixed;inset:0;background:rgba(11,14,28,.5);z-index:60;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--surface);z-index:61;box-shadow:var(--sh-lg);transform:translateX(105%);transition:transform 240ms ease;overflow-y:auto}
.drawer.on{transform:none}
.drawer-h{padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;display:flex;gap:12px;justify-content:space-between}
.drawer-h h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.x{font-size:20px;color:var(--t3);padding:0 6px;line-height:1}
.drawer-b{padding:20px 22px 40px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);opacity:0;pointer-events:none;width:min(520px,calc(100% - 24px));max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:16px;box-shadow:var(--sh-lg);z-index:62;transition:.2s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal-h{padding:18px 22px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal-h h2{font-size:17px;font-weight:800}
.modal-b{padding:10px 22px 22px}
.modal-f{padding:0 22px 20px;display:flex;justify-content:flex-end;gap:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:14px 0}
.kv div span{display:block;font-size:11.5px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kv div b{font-size:14px}
.cost{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:14px 0}
.cost .r{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;color:var(--t2)}
.cost .r.t{border-top:1px dashed var(--border);margin-top:6px;padding-top:8px;font-weight:700;color:var(--t1)}
.tl{list-style:none;border-left:2px solid var(--brand-border);margin:8px 0 0 5px;padding-left:20px}
.tl li{position:relative;padding-bottom:15px;font-size:13px}
.tl li::before{content:'';position:absolute;left:-27px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.tl li.ok::before{background:var(--green)}.tl li.warn::before{background:var(--amber)}.tl li.bad::before{background:var(--red)}
.tl li time{display:block;font-size:11.5px;color:var(--t3)}
.tl li b{font-weight:700}.tl li span{color:var(--t2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* VERIFY */
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:10px}
.step .ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0;background:var(--gray-bg);color:var(--gray)}
.step.ok .ico{background:var(--green-bg);color:var(--green-t)}.step.warn .ico{background:var(--amber-bg);color:var(--amber-t)}
.step.fail .ico{background:var(--red-bg);color:var(--red-t)}.step.skip{opacity:.5}
.step .t{font-weight:600;font-size:13.5px}.step .d{font-size:12.5px;color:var(--t3)}
.spin{width:14px;height:14px;border:2px solid var(--brand-border);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.verdict{border-radius:12px;padding:16px 18px;margin-top:14px;display:flex;gap:14px;align-items:flex-start}
.verdict.clean{background:var(--green-bg);border:1px solid rgba(18,183,106,.35)}
.verdict.review{background:var(--amber-bg);border:1px solid rgba(247,144,9,.4)}
.verdict.blocked{background:var(--red-bg);border:1px solid rgba(240,68,56,.4)}
.verdict .big{font-size:26px;line-height:1}
.verdict b{font-size:15px}
.imei-in{font-size:20px!important;letter-spacing:2px;height:46px!important;font-family:ui-monospace,Menlo,monospace}
.tests{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wa{background:#E7FFDB;border-radius:10px;padding:10px 12px;font-size:13px;color:#1a2b1a;max-width:420px;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-line}
.wa.in{background:#fff}
.wa small{display:block;text-align:right;color:#6b7b6b;font-size:10.5px;margin-top:4px}
.wa-box{background:#EFE9DF;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:var(--t3);background:var(--ws-bg);border-radius:8px;padding:8px 10px;margin-top:10px}

/* Charts */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hbar .tr{height:10px;background:var(--border-lt);border-radius:0 5px 5px 0}
.hbar .tr i{display:block;height:100%;background:#4F46E5;border-radius:0 4px 4px 0}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:90;background:#0D1527;color:#fff;font-size:12px;padding:6px 10px;border-radius:7px;pointer-events:none;opacity:0;transition:opacity .1s;max-width:260px;box-shadow:var(--sh-lg)}
#tip.on{opacity:1}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#0D1527;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--sh-lg);animation:up .25s ease;max-width:90vw}
@keyframes up{from{opacity:0;transform:translateY(10px)}}

/* Automations */
.auto{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.auto-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.auto h3{font-size:14px}
.auto p{font-size:12.5px;color:var(--t2)}
.auto .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--border-lt)}
.auto .cnt{font-size:12px;color:var(--t3)}.auto .cnt b{color:var(--t1);font-size:15px}
.sw{position:relative;width:36px;height:20px;border-radius:99px;background:#CBD2DC;transition:.15s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--green)}.sw.on::after{left:18px}
.feed li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-lt);font-size:13px}
.feed li:last-child{border-bottom:none}
.feed .fi{width:28px;height:28px;border-radius:8px;background:var(--brand-light);display:grid;place-items:center;flex-shrink:0;font-size:13px}
.feed time{display:block;font-size:11.5px;color:var(--t3)}
.alert-li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-lt);font-size:13px;align-items:flex-start;cursor:pointer}
.alert-li:last-child{border-bottom:none}
.alert-li .n{font-weight:800;font-size:15px;min-width:26px}

@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%);transition:.22s}
  .sidebar.open{transform:none}
  .burger{display:block}
  #main{padding:18px 14px 48px}
  .topbar{padding:0 12px}
  .demo-pill{display:none}
}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}.hbar{grid-template-columns:110px 1fr 76px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sb">
    <div class="sb-head"><div class="logo"><div class="logo-mark">📱</div><div><div class="logo-name">Importech</div><div class="logo-tag">Control de inventario iPhone</div></div></div></div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot"><b>Demo interactivo</b>Datos ficticios. Nada se guarda al recargar.</div>
  </aside>
  <div class="main-wrap">
    <header class="topbar">
      <button class="burger" data-a="menu" aria-label="Menú">☰</button>
      <div class="search"><span>🔍</span><input id="gsearch" placeholder="Buscar por IMEI, modelo o cliente…" autocomplete="off"></div>
      <div class="top-right"><span class="demo-pill">Demo · resultados de IMEI simulados</span><div class="avatar">DA</div></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div class="scrim" id="scrim" data-a="closeAll"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div id="tip"></div>
<div id="toast"></div>

<script>
/* =====================================================
   IMPORTECH · DEMO (sin backend · datos ficticios)
   ===================================================== */
const CFG={name:'Importech',trm:4050};
const DAY=864e5,NOW=Date.now(),ago=d=>NOW-d*DAY,hrs=h=>NOW-h*36e5;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CO');
const fmtM=n=>Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(1).replace('.',',')+' M':fmt(n);
const fdate=t=>new Date(t).toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
const ftime=t=>new Date(t).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',hour12:false});
const fdt=t=>fdate(t)+' · '+ftime(t);
const days=t=>Math.max(0,Math.floor((Date.now()-t)/DAY));

/* ---------- IMEI helpers ---------- */
function luhnOk(s){if(!/^\d{15}$/.test(s))return false;let sum=0;for(let i=0;i<15;i++){let d=+s[14-i];if(i%2===1){d*=2;if(d>9)d-=9}sum+=d}return sum%10===0}
function withCheck(b){let sum=0;for(let i=0;i<14;i++){let d=+b[13-i];if(i%2===0){d*=2;if(d>9)d-=9}sum+=d}return b+((10-sum%10)%10)}
const mkImei=(tac,n)=>withCheck(tac+String(n).padStart(6,'0'));

/* ---------- Catálogo ---------- */
const MODELS=[
 {n:'iPhone 17 Pro Max',tac:'35911001',retail:6899000,trade:5300000},
 {n:'iPhone 17 Pro',tac:'35911002',retail:5899000,trade:4500000},
 {n:'iPhone 17',tac:'35911003',retail:4199000,trade:3300000},
 {n:'iPhone 16 Pro',tac:'35822001',retail:4799000,trade:3500000},
 {n:'iPhone 16',tac:'35822002',retail:3499000,trade:2600000},
 {n:'iPhone 15 Pro',tac:'35733001',retail:3999000,trade:2800000},
 {n:'iPhone 15',tac:'35733002',retail:2999000,trade:2100000},
 {n:'iPhone 14',tac:'35644001',retail:2299000,trade:1500000},
 {n:'iPhone 13',tac:'35555001',retail:1799000,trade:1100000}];
const M=Object.fromEntries(MODELS.map(m=>[m.n,m]));
const STOR={128:-400000,256:0,512:1000000,1024:2000000};
const COND_F={'Nuevo':1,'Open-box':.93,'Reacondicionado':.82,'Usado A':.72};
const WARR={'Nuevo':12,'Open-box':12,'Reacondicionado':6,'Usado A':3};
const BRANCHES=['Sede Centro','Sede Norte','Bodega'];
const STAFF=['Andrés','Laura','Marcela','Sofía'];
const listPrice=(model,gb,cond)=>Math.round(((M[model]?.retail||3000000)+(STOR[gb]||0))*(COND_F[cond]||1)/1000)*1000;

/* Registro simulado de IMEI (en producción: consulta oficial de la base negativa) */

/* =====================================================
   VERIFICACIÓN DE IMEI (simulada)
   ===================================================== */
function verifyImei(imei,ignoreId){
  const steps=[];let verdict='clean',model=null,existing=null;
  const labels=['Formato del IMEI','Modelo (TAC)','Duplicado en tu inventario','Base negativa (hurto / extravío)','Bloqueo iCloud / Buscar mi iPhone','Bloqueo de operador'];
  const P=(l,s,d)=>steps.push({l,s,d});
  if(!luhnOk(imei)){
    P(labels[0],'fail',imei.length!==15?'Debe tener 15 dígitos ('+imei.length+' ingresados)':'El dígito verificador no coincide: IMEI inválido o mal digitado');
    for(let i=1;i<6;i++)P(labels[i],'skip','No se ejecuta');
    return{steps,verdict:'blocked',model,existing,reason:'invalid'};
  }
  P(labels[0],'ok','15 dígitos · dígito verificador correcto');
  model=MODELS.find(m=>m.tac===imei.slice(0,8))||null;
  model?P(labels[1],'ok','Identificado: '+model.n):(P(labels[1],'warn','TAC '+imei.slice(0,8)+' no reconocido · selecciona el modelo manualmente'),verdict='review');
  existing=U.find(u=>u.imei===imei&&u.id!==ignoreId)||null;
  if(existing){P(labels[2],'fail','Ya existe: '+uname(existing)+' · '+existing.id+' · estado '+existing.status);verdict='blocked'}
  else P(labels[2],'ok','No está registrado en ninguna sede');
  const r=REG[imei]||{};
  if(r.neg){P(labels[3],'fail',r.neg);verdict='blocked'}else P(labels[3],'ok','No aparece en la base negativa');
  if(r.icloud){P(labels[4],'warn','Activation Lock ACTIVO · el equipo sigue ligado a un Apple ID');if(verdict==='clean')verdict='review'}
  else P(labels[4],'ok','Sin bloqueo de activación');
  if(r.carrier){P(labels[5],'warn',r.carrier);if(verdict==='clean')verdict='review'}else P(labels[5],'ok','Liberado de operador');
  return{steps,verdict,model,existing,reason:r.neg?'neg':existing?'dup':null};
}

  [0,.5,1].forEach(f=>{const y=pt+(H-pt-pb)*(1-f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#E4E8EF" stroke-width="1"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#6F7E93">$${Math.round(max*f)}M</text>`});
  WEEKS.forEach((w,i)=>{
    const h=(H-pt-pb)*w.v/max,x=pl+i*step+(step-bw)/2,y=H-pb-h;
    g+=`<path d="M${x},${H-pb} V${y+4} Q${x},${y} ${x+4},${y} H${x+bw-4} Q${x+bw},${y} ${x+bw},${y+4} V${H-pb} Z" fill="#4F46E5"/>
    <rect x="${pl+i*step}" y="${pt}" width="${step}" height="${H-pt-pb}" fill="transparent" data-tip="${w.l}: ${fmtM(w.v*1e6)}"/>
    <text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#6F7E93">${w.s}</text>`;

  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas semanales en millones de pesos">${g}</svg>`;
}

  add(1,'Face ID no funciona',TI.fid?0:.20);add(1,'Cámaras con falla',TI.cam?0:.10);add(1,'Botones con falla',TI.btn?0:.05);

  const resale=listPrice(TI.model,TI.gb,'Usado A');

}

const LC={usd:812,qty:5,trm:CFG.trm,freight:1.5,arancel:0,iva:19,margin:16};
function landed(){
  const base=LC.usd*LC.qty*LC.trm,fr=base*LC.freight/100,ar=(base+fr)*LC.arancel/100,iv=(base+fr+ar)*LC.iva/100;
  const totalNoIva=base+fr+ar,total=base+fr+ar+iv,unit=total/LC.qty,unitNo=totalNoIva/LC.qty,price=unitNo/(1-LC.margin/100)*1.0;
  return{base,fr,ar,iv,total,unit,unitNo,price};
}
function landedOut(){const L=landed();return `<div class="cost"><div class="r"><span>Compra en pesos (USD × TRM)</span><span>${fmt(L.base)}</span></div><div class="r"><span>Flete y seguro</span><span>${fmt(L.fr)}</span></div>

  const stock=U.filter(x=>isStock(x)&&x.status!=='En tránsito');
  const bk=[['0–15 d',0,15],['16–30 d',16,30],['31–45 d',31,45],['46–60 d',46,60],['+60 d',61,9999]].map(([l,a,b])=>({l,n:stock.filter(u=>daysIn(u)>=a&&daysIn(u)<=b).length,v:stock.filter(u=>daysIn(u)>=a&&daysIn(u)<=b).reduce((s,u)=>s+u.cost,0)}));
  const mb=Math.max(...bk.map(b=>b.n),1);
  const br=BRANCHES.map(b=>{const s=sold.filter(u=>u.branch===b);return{b,n:s.length,mg:s.reduce((a,u)=>a+u.sale.price-u.cost-u.repairs,0)}});
  return `<div class="page-h"><div><h1>Reportes</h1><p>Rentabilidad y rotación con costos reales, no estimados.</p></div></div>
  <div class="grid g2"><div class="card"><div class="card-h"><div><h3>Margen por modelo</h3><div class="sub">Equipos vendidos · margen real en pesos</div></div></div><div class="card-p">
   ${rows.map(([m,d])=>`<div class="hbar" data-tip="${m}: ${d.n} vendido${d.n>1?'s':''} · margen ${fmt(d.mg)} · ${Math.round(d.mg/d.rev*100)}% sobre ventas"><span>${m}</span><div class="tr"><i style="width:${d.mg/mx*100}%"></i></div><b>${fmtM(d.mg)}</b></div>`).join('')}</div></div>
   <div class="card"><div class="card-h"><div><h3>Antigüedad del inventario</h3><div class="sub">Cantidad de equipos por días en inventario</div></div></div><div class="card-p">
   ${bk.map(b=>`<div class="hbar" data-tip="${b.l}: ${b.n} equipos · ${fmtM(b.v)} en costo"><span>${b.l}</span><div class="tr"><i style="width:${b.n/mb*100}%"></i></div><b>${b.n}</b></div>`).join('')}
   <div class="note">Cada día extra en vitrina es dinero inmovilizado. La automatización de envejecimiento actúa desde los 30 días.</div></div></div></div>
  <div class="card mt"><div class="card-h"><h3>Rendimiento por sede</h3></div><div class="tbl-wrap" style="padding-top:8px"><table><thead><tr><th>Sede</th><th class="num">Equipos vendidos</th><th class="num">Margen real</th><th class="num">Stock actual</th></tr></thead><tbody>
   ${br.map(x=>`<tr><td class="m">${x.b}</td><td class="num">${x.n}</td><td class="num">${fmt(x.mg)}</td><td class="num">${U.filter(u=>u.branch===x.b&&isStock(u)).length}</td></tr>`).join('')}</tbody></table></div></div>`;
}};

/* =====================================================
   ACCIONES
   ===================================================== */
function sellModal(id){
  const u=byId(id);
  openModal(`${modalHead('Vender · '+uname(u))}<div class="modal-b f">
   <div class="row"><div><label>Cliente</label><select id="s-cli">${CLIENTS.map(c=>`<option value="${c.id}">${c.n}</option>`).join('')}<option value="new">+ Cliente nuevo</option></select></div><div id="s-new" style="display:none"><label>Nombre</label><input id="s-nn" placeholder="Nombre completo"></div></div>
   <div class="row"><div><label>Forma de pago</label><select id="s-pay"><option value="contado">Contado</option><option value="cuotas:3">3 cuotas</option><option value="cuotas:6">6 cuotas</option><option value="cuotas:12">12 cuotas</option></select></div><div><label>Descuento %</label><input id="s-disc" type="number" min="0" max="30" value="0"></div></div>
   <div id="s-sum"></div></div><div class="modal-f"><button class="btn" data-a="closeModal">Cancelar</button><button class="btn primary" data-a="doSell" data-id="${id}">Confirmar venta</button></div>`);
  sellSum(id);
}
function sellSum(id){
  const u=byId(id),d=+$('#s-disc').value||0,pay=$('#s-pay').value,price=Math.round(u.price*(1-d/100)/1000)*1000,mg=price-u.cost-u.repairs;
  let h=`<div class="cost"><div class="r"><span>Precio final</span><b>${fmt(price)}</b></div><div class="r"><span>Margen</span><span style="color:${mg/price<.05?'var(--red-t)':'var(--green-t)'}">${fmt(mg)} · ${Math.round(mg/price*100)}%</span></div>`;
  if(pay!=='contado'){const n=+pay.split(':')[1],ab=Math.round(price*.3/1000)*1000,cu=Math.round((price-ab)/n/1000)*1000;h+=`<div class="r"><span>Abono inicial (30%)</span><span>${fmt(ab)}</span></div><div class="r t"><span>${n} cuotas de</span><span>${fmt(cu)}</span></div>`}
  h+='</div>';
  if(d>5)h+=`<div class="note" style="background:var(--amber-bg);color:var(--amber-t)">⚠️ Descuento sobre el límite (5%). Se enviará una alerta de aprobación al dueño.</div>`;
  $('#s-sum').innerHTML=h;
}
function doSell(id){
  const u=byId(id);let cid=$('#s-cli').value;
  if(cid==='new'){const nm=$('#s-nn').value.trim();if(!nm){toast('Escribe el nombre del cliente');return}cid=CLIENTS.length+1;CLIENTS.push({id:cid,n:nm,ph:'300 000 0000'})}else cid=+cid;
  const d=+$('#s-disc').value||0,pay=$('#s-pay').value,price=Math.round(u.price*(1-d/100)/1000)*1000,c=cli(cid);
  u.status='Vendido';u.sale={t:Date.now(),client:cid,pay,price,by:'Laura'};u.apartado=null;u.price=price;
  const fe='FE-'+(2131+U.filter(x=>x.sale).length-9);
  addEv(u,Date.now(),'Vendido',c.n+' · '+(pay==='contado'?'contado':'plan de '+pay.split(':')[1]+' cuotas')+' · '+fmt(price),'ok');
  addEv(u,Date.now()+1,'Factura electrónica',fe+' emitida con el IMEI en el detalle');
  addEv(u,Date.now()+2,'Garantía activada',WARR[u.cond]+' meses','ok');
  if(pay!=='contado'){const n=+pay.split(':')[1],ab=Math.round(price*.3/1000)*1000;PLANS.push({id:'P-'+(40+PLANS.length),unit:u.id,client:cid,total:price,abono:ab,n,cuota:Math.round((price-ab)/n/1000)*1000,paid:0,next:Date.now()+30*DAY});}
  WEEKS[7].v=+(WEEKS[7].v+price/1e6).toFixed(1);
  logAct('🧾','Venta de <b>'+uname(u)+'</b> a '+esc(c.n)+' · factura '+fe+' emitida');
  if(d>5){logAct('🚨','Alerta al dueño: descuento de <b>'+d+'%</b> en '+uname(u));toast('🚨 Alerta enviada al dueño: descuento del '+d+'%')}
  closeModal();closeDrawer();paintNav();render();
  toast('✅ Venta registrada · factura '+fe+' · garantía activada');
}
function closeDrawer(){$('#drawer').classList.remove('on');if(!$('#modal').classList.contains('on'))$('#scrim').classList.remove('on')}
function remindModal(pid){
  const p=PLANS.find(x=>x.id===pid),c=cli(p.client),u=byId(p.unit),s=planState(p);
  const d=s==='mora'?days(p.next):0;
  const msg=s==='mora'?`Hola ${c.n.split(' ')[0]}, tu cuota ${p.paid+1} de ${p.n} del ${uname(u)} por *${fmt(p.cuota)}* está vencida hace ${d} días.
Puedes ponerte al día ahora: [enlace de pago Bold]
Si ya pagaste, responde con tu comprobante. 🙏`:`Hola ${c.n.split(' ')[0]} 👋 Te recordamos que tu cuota ${p.paid+1} de ${p.n} del ${uname(u)} por *${fmt(p.cuota)}* vence el *${fdate(p.next)}*.
Paga fácil aquí: [enlace de pago Bold]`;
  const stage=s==='mora'?(d>=10?'Etapa 4 · gestor humano':d>=4?'Etapa 3 · llamada con IA':'Etapa 2 · aviso de mora'):'Etapa 1 · recordatorio preventivo';
  openModal(`${modalHead('Recordatorio por WhatsApp')}<div class="modal-b"><div style="margin-bottom:10px">${chip(stage,s==='mora'?'bad':'info')} <span style="color:var(--t3);font-size:12.5px">${c.n} · ${c.ph}</span></div>
   <div class="wa-box"><div class="wa">${esc(msg).replace(/\*(.+?)\*/g,'<b>$1</b>')}<small>${ftime(Date.now())} ✓✓</small></div></div>
   <div class="note">Respeta el horario permitido y se detiene si el cliente pide no ser contactado.</div></div><div class="modal-f"><button class="btn" data-a="closeModal">Cerrar</button><button class="btn primary" data-a="sendRemind" data-id="${pid}">Enviar ahora</button></div>`);
}

const ACT={
 nav:d=>go(d.v),
 menu:()=>$('#sb').classList.toggle('open'),
 closeAll,closeModal,closeDrawer,
 unit:d=>{closeModal();openUnit(d.id)},
 goAged:()=>{S.inv={q:'',st:'age',br:'',cd:''};go('inventario')},
 fill:d=>{const v=d.k==='dup'?U[0].imei:d.k==='bad'?'354000000000123':T[d.k];$('#imei').value=v;doVerify()},
 verify:doVerify,
 saveUnit:()=>{
  const {res,imei}=S.v;const model=$('#a-model').value,gb=+$('#a-gb').value,color=$('#a-color').value.trim();
  if(!color){toast('Escribe el color del equipo');$('#a-color').focus();return}
  const cost=+$('#a-cost').value,price=+$('#a-price').value;if(!cost||!price){toast('Completa costo y precio');return}
  const u={id:'U-'+(uidn++),imei,model,gb,color,cond:$('#a-cond').value,batt:+$('#a-batt').value||100,cost,price,branch:$('#a-br').value,status:'En vitrina',acq:Date.now(),source:$('#a-src').value,repairs:0,tl:[],claim:false,sale:null};
  addEv(u,Date.now()-2000,'Compra / ingreso',u.source);
  addEv(u,Date.now()-1000,'Verificación de IMEI',res.verdict==='clean'?'Base negativa: limpio · iCloud: libre · Operador: libre':'Advertencia aprobada por el gerente: '+res.steps.filter(s=>s.s==='warn').map(s=>s.d).join(' | '),res.verdict==='clean'?'ok':'warn');
  addEv(u,Date.now(),'En vitrina',u.branch);
  U.unshift(u);logAct('📱','Nuevo ingreso: <b>'+uname(u)+'</b> · IMEI verificado ('+(res.verdict==='clean'?'limpio':'con aprobación')+')');
  toast('✅ '+uname(u)+' guardado en inventario');paintNav();S.inv={q:'',st:'',br:'',cd:''};go('inventario');setTimeout(()=>openUnit(u.id),250)},
 sell:d=>sellModal(d.id),doSell:d=>doSell(d.id),
 toWorkshop:d=>{const u=byId(d.id);u.status='En taller';ORDERS.unshift({id:'T-'+(33+ORDERS.length-4),unit:u.id,job:'Diagnóstico general',st:'Diagnóstico',cost:0,tech:'Andrés'});addEv(u,Date.now(),'Entró a taller','Orden de diagnóstico abierta','warn');closeDrawer();render();paintNav();toast('🔧 Orden de taller creada')},
 reverify:d=>{const u=byId(d.id),r=verifyImei(u.imei,u.id);addEv(u,Date.now(),'Re-verificación de IMEI',r.verdict==='clean'?'Sin cambios: limpio en base negativa, iCloud y operador':r.steps.filter(s=>s.s!=='ok').map(s=>s.d).join(' | '),r.verdict==='clean'?'ok':'bad');openUnit(u.id);toast(r.verdict==='clean'?'✅ IMEI sigue limpio':'⚠️ Se encontraron novedades')},
 claim:d=>{const u=byId(d.id);u.claim=true;addEv(u,Date.now(),'Reclamo de garantía abierto','Pendiente de revisión técnica','warn');logAct('🛡️','Reclamo de garantía abierto: <b>'+uname(u)+'</b>');if(S.view==='garantias')render();if($('#drawer').classList.contains('on'))openUnit(u.id);toast('Reclamo registrado en la línea de tiempo')},
 advance:d=>{const o=ORDERS.find(x=>x.id===d.id),u=byId(o.unit);
  if(o.st==='Listo'){u.status='En vitrina';u.repairs+=o.cost;addEv(u,Date.now(),'Reparación terminada',o.job+' · costo '+fmt(o.cost)+' sumado al equipo','ok');addEv(u,Date.now()+1,'En vitrina',u.branch);ORDERS.splice(ORDERS.indexOf(o),1);toast('✅ '+uname(u)+' volvió a vitrina · +'+fmt(o.cost)+' al costo');logAct('🔧','Reparación terminada: <b>'+uname(u)+'</b>')}
  else{o.st=ORDER_FLOW[ORDER_FLOW.indexOf(o.st)+1];if(o.st==='En reparación'&&!o.cost)o.cost=150000;if(o.st==='Esperando repuesto'&&!o.cost)o.cost=180000}
  render();paintNav()},
 remind:d=>remindModal(d.id),
 sendRemind:d=>{const p=PLANS.find(x=>x.id===d.id);logAct('💬','Recordatorio de cuota enviado a <b>'+cli(p.client).n+'</b>');closeModal();toast('💬 Recordatorio enviado por WhatsApp')},
 payCuota:d=>{const p=PLANS.find(x=>x.id===d.id);if(p.paid>=p.n){toast('Este plan ya está pagado');return}p.paid++;p.next+=30*DAY;if(p.next<NOW&&p.paid<p.n)p.next=NOW+30*DAY;const u=byId(p.unit);addEv(u,Date.now(),'Cuota '+p.paid+' de '+p.n+' pagada',fmt(p.cuota)+' · Bold','ok');logAct('💰','Pago recibido: cuota '+p.paid+'/'+p.n+' de <b>'+cli(p.client).n+'</b>');render();paintNav();toast('✅ Pago registrado')},
 receive:d=>{const t=TRANSFERS.find(x=>x.id===d.id);t.st='Recibido';t.units.forEach(id=>{const u=byId(id);u.status='En vitrina';u.branch=t.to;addEv(u,Date.now(),'Recibido en '+t.to,'Guía '+t.guia+' · confirmado','ok');addEv(u,Date.now()+1,'En vitrina',t.to)});logAct('🚚','Transferencia <b>'+t.id+'</b> recibida en '+t.to);render();toast('✅ '+t.units.length+' equipo(s) ahora en vitrina de '+t.to)},
 toggleAuto:d=>{AUTO_ON[d.id]=!AUTO_ON[d.id];render()},
 autoEx:d=>{const a=AUTOS.find(x=>x.id===d.id);openModal(`${modalHead(a.ic+' '+a.n)}<div class="modal-b"><p style="font-size:13px;color:var(--t2);margin-bottom:12px">${a.d}</p><div style="font-size:11.5px;font-weight:700;color:var(--t3);text-transform:uppercase;margin-bottom:6px">Ejemplo real</div>${autoExample(a.id)}</div><div class="modal-f"><button class="btn primary" data-a="closeModal">Entendido</button></div>`)},
 tiFill:d=>{TI.imei=T[d.k];$('#ti-imei').value=TI.imei;tiRefresh()},
 acceptTi:()=>{
  const q=tradeQuote();if(q.block)return;
  const u={id:'U-'+(uidn++),imei:TI.imei,model:TI.model,gb:TI.gb,color:'Por definir',cond:'Usado A',batt:TI.batt,cost:q.q,price:q.resale,branch:'Bodega',status:'En revisión',acq:Date.now(),source:'Trade-in',repairs:0,tl:[],claim:false,sale:null};
  addEv(u,Date.now()-3000,'Trade-in recibido','Cotización aceptada por el cliente · '+fmt(q.q));
  addEv(u,Date.now()-2000,'IMEI verificado','Base negativa: limpio · cliente cerró iCloud frente al empleado','ok');
  addEv(u,Date.now()-1000,'Revisión de ingreso','Batería '+TI.batt+'% · '+q.d.map(x=>x[0]).join(', ')||'sin novedades');
  U.unshift(u);logAct('🔁','Trade-in recibido: <b>'+uname(u)+'</b> por '+fmt(q.q));TI.imei='';paintNav();toast('✅ Trade-in registrado · pasa a revisión');S.inv={q:'',st:'En revisión',br:'',cd:''};go('inventario')}
};
function tiRefresh(){$('#ti-out').innerHTML=tiOut(tradeQuote())}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(!a)return;
  if(a.dataset.a==='closeAll'&&e.target!==$('#scrim'))return;
  const f=ACT[a.dataset.a];if(f)f(a.dataset,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-q'){S.inv.q=t.value;$('#inv-t').innerHTML=invTable()}
  if(t.id==='gsearch'){if(t.value.length>=2){S.inv={q:t.value,st:'',br:'',cd:''};if(S.view!=='inventario')go('inventario');else{$('#inv-t').innerHTML=invTable();const q=$('#f-q');if(q)q.value=t.value}}}
  if(t.dataset.lc){LC[t.dataset.lc]=+t.value||0;$('#lc-out').innerHTML=landedOut()}
  if(['a-cost','a-price'].includes(t.id)){t.dataset.touched=1;showMg()}
  if(['a-model','a-gb','a-cond'].includes(t.id)){suggestFill()}
  if(t.id==='s-disc'){sellSum(document.querySelector('[data-a=doSell]').dataset.id)}
  if(t.id==='ti-imei'){t.value=t.value.replace(/\D/g,'');TI.imei=t.value;tiRefresh()}
  if(t.id==='ti-batt'){TI.batt=+t.value||0;tiRefresh()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-st'){S.inv.st=t.value;$('#inv-t').innerHTML=invTable()}
  if(t.id==='f-br'){S.inv.br=t.value;$('#inv-t').innerHTML=invTable()}
  if(t.id==='f-cd'){S.inv.cd=t.value;$('#inv-t').innerHTML=invTable()}
  if(t.id==='a-ok'){$('#a-save').disabled=!t.checked}
  if(t.id==='s-cli'){$('#s-new').style.display=t.value==='new'?'block':'none'}
  if(t.id==='s-pay'){sellSum(document.querySelector('[data-a=doSell]').dataset.id)}
  const map={'ti-model':'model','ti-gb':'gb','ti-scr':'scr','ti-body':'body'};
  if(map[t.id]){TI[map[t.id]]=t.id==='ti-model'?t.value:+t.value;tiRefresh()}
  if(['ti-fid','ti-cam','ti-btn','ti-icl'].includes(t.id)){TI[t.id.slice(3)]=t.checked;tiRefresh()}
});
/* Tooltip de gráficos */
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t){tip.textContent=t.dataset.tip;tip.classList.add('on')}});
document.addEventListener('mousemove',e=>{if(tip.classList.contains('on')){tip.style.left=Math.min(e.clientX+14,innerWidth-270)+'px';tip.style.top=(e.clientY+16)+'px'}});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});

/* Inicio */
paintNav();render();
</script>
</body>
</html>
